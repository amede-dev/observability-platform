apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluentd-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/amede-dev/observability-platform.git   # à remplacer
    targetRevision: main
    path: fluentd
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { prune: true, selfHeal: true }
