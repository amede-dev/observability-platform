<system>
  log_level info
</system>

# Métriques Fluentd (scrapées par Prometheus via le ServiceMonitor de la chart)
<source>
  @type prometheus
  bind 0.0.0.0
  port 24231
  metrics_path /metrics
</source>
<source>
  @type prometheus_output_monitor
  interval 10
</source>

# 1. Lecture des logs de conteneurs (format CRI)
<source>
  @type tail
  path /var/log/containers/*.log
  exclude_path ["/var/log/containers/fluentd-*.log", "/var/log/containers/*_kube-system_*.log"]
  pos_file /var/log/fluentd-buffers/containers.log.pos
  tag kubernetes.*
  read_from_head true
  <parse>
    @type regexp
    expression /^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[FP]) (?<log>.*)$/
    # Les logs CRI de Kind utilisent le suffixe UTC `Z`.
    time_format %Y-%m-%dT%H:%M:%S.%NZ
  </parse>
</source>

# 2. Enrichissement avec les métadonnées Kubernetes
<filter kubernetes.**>
  @type kubernetes_metadata
  skip_labels false
  skip_container_metadata true
  skip_master_url true
  skip_namespace_metadata true
</filter>

# 3. Analyse JSON applicatif (repli sur texte brut si invalide)
<filter kubernetes.**>
  @type parser
  key_name log
  reserve_data true
  emit_invalid_record_to_error false
  <parse>
    @type json
  </parse>
</filter>

# 4. Exclusion du bruit (health checks)
<filter kubernetes.**>
  @type grep
  <exclude>
    key log
    pattern /(GET \/healthz|GET \/livez|GET \/readyz)/
  </exclude>
</filter>

# 5. Masquage de données sensibles (BF-10)
<filter kubernetes.**>
  @type record_transformer
  enable_ruby true
  <record>
    message ${record["message"] ? record["message"].to_s.gsub(/(password|passwd|token|secret|api[_-]?key)(["'\s:=]+)[^\s"',}]+/i, '\1\2***') : record["log"].to_s.gsub(/(password|passwd|token|secret|api[_-]?key)(["'\s:=]+)[^\s"',}]+/i, '\1\2***')}
    level ${record["level"] || record["severity"] || "unknown"}
  </record>
  remove_keys log
</filter>

# 6. Envoi vers Loki avec buffer disque (BNF-04)
<match kubernetes.**>
  @type loki
  url "http://loki-gateway.observability.svc:80"
  extra_labels {"cluster":"demo"}
  line_format json
  <label>
    namespace $.kubernetes.namespace_name
    pod $.kubernetes.pod_name
    container $.kubernetes.container_name
    app $.kubernetes.labels.app
  </label>
  <buffer>
    @type file
    path /var/log/fluentd-buffers/loki
    flush_interval 5s
    chunk_limit_size 2m
    total_limit_size 1g
    retry_forever true
    retry_max_interval 30
    overflow_action block
  </buffer>
</match>
