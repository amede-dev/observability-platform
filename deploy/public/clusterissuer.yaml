# Certificats HTTPS Let's Encrypt (challenge HTTP-01 via Traefik).
# Remplacer l'adresse email. Tester d'abord avec le serveur staging si besoin :
# https://acme-staging-v02.api.letsencrypt.org/directory
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: rakotonandrasanaamede5@gmail.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
