apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: dashboard-cluster-overview
    files: [cluster-overview.json]
    options:
      annotations: { grafana_folder: "Plateforme" }
  - name: dashboard-sante-stack
    files: [sante-stack.json]
    options:
      annotations: { grafana_folder: "Plateforme" }
  - name: dashboard-red-par-service
    files: [red-par-service.json]
    options:
      annotations: { grafana_folder: "Applications" }
  - name: dashboard-logs-applicatifs
    files: [logs-applicatifs.json]
    options:
      annotations: { grafana_folder: "Applications" }
