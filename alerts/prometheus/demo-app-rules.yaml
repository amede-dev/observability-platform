apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-app-rules
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: demo-app.recording
      rules:
        - record: job:http_requests:rate5m
          expr: sum by (job, namespace) (rate(http_requests_total[5m]))
        - record: job:http_errors:ratio5m
          expr: |
            sum by (job, namespace) (rate(http_requests_total{status=~"5.."}[5m]))
            /
            sum by (job, namespace) (rate(http_requests_total[5m]))
    - name: demo-app.alerts
      rules:
        - alert: HighHTTPErrorRate
          expr: job:http_errors:ratio5m > 0.05
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "Taux d'erreurs 5xx élevé sur {{ $labels.job }}"
            runbook_url: "https://git.example.com/docs/runbooks/high-error-rate.md"
        - alert: HighLatencyP95
          expr: |
            histogram_quantile(0.95, sum by (le, job) (rate(http_request_duration_seconds_bucket[5m]))) > 1
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Latence p95 supérieure à 1 s sur {{ $labels.job }}"
