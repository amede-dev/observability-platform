# Tests unitaires des règles : promtool test rules alerts/tests/platform-alerts_test.yaml
rule_files:
  - ../rules-extracted/platform-alerts.rules.yaml
  - ../rules-extracted/demo-app-rules.rules.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'up{job="demo-app", instance="10.0.0.1:8080"}'
        values: '1 1 0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 6m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: demo-app
              instance: "10.0.0.1:8080"
            exp_annotations:
              summary: "Cible demo-app injoignable (10.0.0.1:8080)"
              runbook_url: "https://git.example.com/docs/runbooks/target-down.md"

  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="demo-app", namespace="demo", status="200"}'
        values: '0+60x20'
      - series: 'http_requests_total{job="demo-app", namespace="demo", status="500"}'
        values: '0+20x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: HighHTTPErrorRate
        exp_alerts:
          - exp_labels:
              severity: critical
              job: demo-app
              namespace: demo
            exp_annotations:
              summary: "Taux d'erreurs 5xx élevé sur demo-app"
              runbook_url: "https://git.example.com/docs/runbooks/high-error-rate.md"
